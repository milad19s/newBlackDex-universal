
name: Build Universal APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Checkout source code
      - name: Checkout
        uses: actions/checkout@v4

      # Read application version
      - name: Read App Version
        id: version
        run: |
          VERSION=$(grep -m1 'versionName' app/build.gradle | sed -E 's/.*versionName[[:space:]]+"([^"]+)".*/\1/')

          if [ -z "$VERSION" ] || [ "$VERSION" = "$(grep -m1 'versionName' app/build.gradle)" ]; then
            echo "Could not read app version"
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "App version: $VERSION"

      # Java 17 for Android SDK
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Locate preinstalled Android SDK
      - name: Configure Android SDK
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"

          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort -V | tail -n 1)

          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found"
            exit 1
          fi

          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

          echo "SDK Manager found: $SDKMANAGER"

      # Accept Android licenses
      - name: Accept Android Licenses
        run: |
          yes | sdkmanager --licenses

      # Install required packages
      - name: Install Android Tools
        run: |
          sdkmanager \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;30.0.3" \
            "ndk;21.4.7075529"

      # Java 11 for old Gradle
      - name: Setup Java 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      # Build Universal APK
      - name: Build Universal APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleUniversalDebug

      # Prepare APK
      - name: Prepare APK
        run: |
          mkdir -p release

          APK=$(find app/build/outputs/apk -type f -name "*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "APK not found!"
            exit 1
          fi

          cp "$APK" "release/BlackDex-${{ steps.version.outputs.version }}-Universal.apk"

          echo "APK prepared successfully"

      # Upload artifact
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BlackDex-${{ steps.version.outputs.version }}-Universal
          path: release/*.apk
          if-no-files-found: error

      # Publish GitHub Release
      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: ${{ steps.version.outputs.version }} BlackDex Universal
          body: |
            BlackDex Universal

            Version: ${{ steps.version.outputs.version }}

            Supports:
            - ARMv7 (armeabi-v7a)
            - ARM64 (arm64-v8a)
          files: release/*.apk
          fail_on_unmatched_files: true
          make_latest: true
