
name: Build Universal APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses

      - name: Install Android tools
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;30.0.3" \
            "ndk;21.4.7075529"

      - name: Setup Java 11 for Gradle
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Build Universal APK
        run: |
          chmod +x gradlew
          ./gradlew assembleUniversalDebug

      - name: Prepare APK
        run: |
          APK=$(find app/build/outputs/apk -type f -name "*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "APK not found!"
            exit 1
          fi

          cp "$APK" BlackDex-Universal.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BlackDex-Universal-APK
          path: BlackDex-Universal.apk
          if-no-files-found: error

      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: BlackDex Universal v1.0.${{ github.run_number }}
          body: |
            BlackDex Universal APK

            Supports:
            - ARMv7 (armeabi-v7a)
            - ARM64 (arm64-v8a)
          files: BlackDex-Universal.apk
          fail_on_unmatched_files: true
