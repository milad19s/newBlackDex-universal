
name: Build Universal APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Install Android SDK packages
        run: |
          sdkmanager \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;30.0.3" \
            "cmake;3.10.2" \
            "ndk;21.4.7075529"

      - name: Build Universal APK
        run: |
          chmod +x gradlew
          ./gradlew assembleUniversalDebug

      - name: Prepare APK
        run: |
          mkdir -p release-apk
          APK=$(find app/build/outputs/apk -type f -name "*.apk" | head -n 1)
          if [ -z "$APK" ]; then
            echo "APK file not found!"
            exit 1
          fi
          cp "$APK" release-apk/BlackDex-Universal.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BlackDex-Universal-APK
          path: release-apk/BlackDex-Universal.apk

      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: universal-build-${{ github.run_number }}
          name: BlackDex Universal Build ${{ github.run_number }}
          files: release-apk/BlackDex-Universal.apk
          make_latest: true
          body: |
            Universal APK for ARMv7 and ARM64.
            Built automatically with GitHub Actions.
